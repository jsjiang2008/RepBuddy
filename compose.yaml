name: repbuddy

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: repbuddy
      POSTGRES_USER: repbuddy
      POSTGRES_PASSWORD: repbuddy_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repbuddy -d repbuddy"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
